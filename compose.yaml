name: earthlens

services:
  backend:
    image: earthlens-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${EARTHLENS_PORT:-5000}:5000"
    environment:
      FLASK_DEBUG: "0"
      EARTHLENS_TEMPLATES_AUTO_RELOAD: "true"
      EARTHLENS_CACHE_DIR: /app/data/cache/power
      EARTHLENS_POWER_REQUEST_DELAY: "1.0"
      EARTHLENS_DATABASE_PATH: /app/data/runtime/earthlens.sqlite3
      EARTHLENS_WEATHER_COMMERCIAL: "${EARTHLENS_WEATHER_COMMERCIAL:-false}"
      EARTHLENS_SECRET_KEY: "${EARTHLENS_SECRET_KEY:-}"
      OPEN_METEO_API_KEY: "${OPEN_METEO_API_KEY:-}"
      EARTHLENS_SMTP_HOST: "${EARTHLENS_SMTP_HOST:-}"
      EARTHLENS_SMTP_PORT: "${EARTHLENS_SMTP_PORT:-587}"
      EARTHLENS_SMTP_USER: "${EARTHLENS_SMTP_USER:-}"
      EARTHLENS_SMTP_PASS: "${EARTHLENS_SMTP_PASS:-}"
      EARTHLENS_SMTP_FROM: "${EARTHLENS_SMTP_FROM:-}"
    mem_limit: 1g
    command:
      - python
      - -m
      - flask
      - --app
      - app:create_app
      - run
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --reload
      - --no-debugger
    volumes:
      - type: bind
        source: ./data/runtime
        target: /app/data/runtime
      - type: bind
        source: ./web
        target: /app/web
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./templates
        target: /app/templates
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./static
        target: /app/static
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./app.py
        target: /app/app.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./api
        target: /app/api
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./services
        target: /app/services
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /app/scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tests
        target: /app/tests
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/water_features.json
        target: /app/data/water_features.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/cities.json
        target: /app/data/cities.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/missions.json
        target: /app/data/missions.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/variables.json
        target: /app/data/variables.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/guided_missions.json
        target: /app/data/guided_missions.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/mission_variables.json
        target: /app/data/mission_variables.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment
        target: /app/deployment
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/cache
        target: /app/data/cache
        bind:
          create_host_path: false

  monitor:
    extends:
      service: backend
    profiles: [monitoring]
    ports: !reset []
    command: [python, -m, scripts.maintenance.monitor_events, --loop, --interval, "3600"]
    healthcheck:
      disable: true
    restart: unless-stopped

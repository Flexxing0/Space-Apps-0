<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EarthLens — NASA Space Apps 2026{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global/styles.css') }}">
  {% block extra_css %}{% endblock %}
</head>

<body>
  {% include "components/_navigation.html" %}

  {% block content %}{% endblock %}

  <footer class="el-footer py-3 mt-5">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <strong>EarthLens</strong> · NASA Space Apps Challenge 2026 — <em>Be An Earth System Trend Detective!</em>
      </div>
      <div>
        Fuente principal: <a href="https://power.larc.nasa.gov/" target="_blank" rel="noopener noreferrer">NASA POWER /
          MERRA-2</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>

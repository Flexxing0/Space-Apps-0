<header class="top" aria-label="Controles de EarthLens">
  <div class="top-left">
    <a class="brand" href="/" aria-label="EarthLens, Time Machine">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">EarthLens</span>
      <small>ARGENTINA</small>
    </a>
    <label class="city-search">
      <span class="sr-only">Buscar ciudad argentina</span>
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" list="city-suggestions" placeholder="Buscar ciudad…" value="Comodoro Rivadavia" autocomplete="off">
      <datalist id="city-suggestions"></datalist>
      <div id="search-dropdown" class="search-dropdown" hidden></div>
    </label>
    <label class="territory-top" hidden>
      <span class="sr-only">Selección territorial</span>
      <select id="territory">
        <option value="city">Una ciudad</option>
        <option value="multi">Varias ciudades</option>
        <option value="province">Provincia</option>
        <option value="region">Región</option>
        <option value="polygon">Área dibujada</option>
      </select>
    </label>
  </div>
  <div class="top-actions">
    <button id="btn-saved" type="button" class="top-link-btn" data-panel="saved" aria-label="Guardados" title="Destinos y eventos guardados">
      <svg class="saved-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span class="top-link-text">Guardados</span>
    </button>
    <button id="btn-calendar" type="button" class="top-icon-btn" data-panel="calendar" aria-label="Abrir calendario" title="Agenda y calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v5M17 2v5M3 10h18"/><rect x="7" y="13" width="3" height="3" rx="0.5"/></svg>
    </button>
    <button id="btn-notifications" type="button" class="top-icon-btn has-badge" data-panel="notifications" aria-label="Abrir notificaciones" title="Notificaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2.5H4L6 16Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span id="badge" class="notif-badge"></span>
    </button>
    <button id="btn-avatar" type="button" class="avatar-btn" data-panel="events" aria-label="Cuenta y eventos" title="Mi cuenta y eventos">
      <span id="avatar-initial" class="avatar-circle">👤</span>
      <span id="avatar-username" class="avatar-username">Ingresar</span>
    </button>
    <button id="present" type="button" class="sr-only" title="Volver al momento actual">Ahora</button>
    <button id="toggle-tools" type="button" class="top-icon-btn tools-trigger" aria-label="Abrir herramientas científicas" aria-controls="tools" aria-expanded="false" title="Herramientas científicas">⚙</button>
    <details class="more-menu">
      <summary aria-label="Más herramientas" title="Más herramientas">•••</summary>
      <nav aria-label="Navegación principal">
        <button id="theme" type="button">Cambiar tema</button>
      </nav>
    </details>
  </div>
</header>
